spring.application.name=Rotineiro

# Secrets/Env
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
app.frontend.url=${APP_FRONTEND_URL}

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# IMPORTANTE: em produção, evite update para não manter tráfego constante
spring.jpa.hibernate.ddl-auto=none

# Configuração da JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP - ajustado para não manter conexões vivas
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000        # fecha conexões ociosas após 10s
spring.datasource.hikari.max-lifetime=30000        # recicla conexões em até 30s
spring.datasource.hikari.connection-timeout=10000  # espera até 10s por conexão antes de erro
